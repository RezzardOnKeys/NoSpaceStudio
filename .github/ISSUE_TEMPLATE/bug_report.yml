name: Bug report
description: Something does not work as expected
title: 'bug: '
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, and what went wrong?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See the error
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options: [Safari, Chrome, Firefox, Edge, Other]
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: e.g. MacBook Air, iPhone 15
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or console errors
