<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f08a80"/>
      <stop offset="0.5" stop-color="#f0894a"/>
      <stop offset="1" stop-color="#6fbf73"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="#eceef1"/>
  <!-- studio floor -->
  <rect y="470" width="600" height="330" fill="#f3f1ec"/>
  <!-- pink splat -->
  <g fill="#ff2d95">
    <circle cx="150" cy="560" r="120"/>
    <circle cx="60" cy="640" r="80"/>
    <circle cx="250" cy="640" r="70"/>
    <circle cx="120" cy="720" r="90"/>
    <circle cx="290" cy="545" r="34"/>
    <circle cx="40" cy="500" r="26"/>
    <circle cx="330" cy="690" r="20"/>
  </g>
  <!-- teal splat -->
  <g fill="#00cfc1">
    <circle cx="470" cy="610" r="110"/>
    <circle cx="560" cy="700" r="90"/>
    <circle cx="390" cy="720" r="70"/>
    <circle cx="545" cy="520" r="44"/>
    <circle cx="350" cy="600" r="24"/>
    <circle cx="430" cy="490" r="18"/>
  </g>
  <!-- flying water -->
  <g fill="#ff2d95">
    <circle cx="372" cy="318" r="15"/>
    <circle cx="412" cy="296" r="12"/>
    <circle cx="448" cy="282" r="10"/>
    <circle cx="480" cy="276" r="8"/>
  </g>
  <!-- the character: a pill with a cap, half fish -->
  <g transform="translate(230 250)">
    <ellipse cx="60" cy="318" rx="92" ry="16" fill="#1d2028" opacity="0.14"/>
    <!-- tail fin -->
    <path d="M-8 210 L-52 188 L-40 236 Z" fill="#d98c86"/>
    <!-- legs and sneakers -->
    <rect x="30" y="240" width="12" height="46" fill="#f2a09a"/>
    <rect x="78" y="240" width="12" height="46" fill="#f2a09a"/>
    <rect x="10" y="282" width="50" height="26" rx="13" fill="#ff2d95"/>
    <rect x="62" y="282" width="50" height="26" rx="13" fill="#ff2d95"/>
    <rect x="10" y="300" width="50" height="8" rx="4" fill="#f7f6f2"/>
    <rect x="62" y="300" width="50" height="8" rx="4" fill="#f7f6f2"/>
    <!-- body: head, shirt, shorts -->
    <rect x="0" y="40" width="120" height="210" rx="60" fill="#f2a09a"/>
    <path d="M0 150 H120 V200 H0 Z" fill="#f7f6f2"/>
    <path d="M0 200 H120 V210 a60 44 0 0 1 -120 0 Z" fill="#ff2d95"/>
    <!-- fish print -->
    <ellipse cx="56" cy="176" rx="16" ry="9" fill="#ff2d95"/>
    <path d="M70 176 L84 167 V185 Z" fill="#ff2d95"/>
    <!-- eyes with heavy lids -->
    <ellipse cx="36" cy="104" rx="17" ry="19" fill="#fff"/>
    <ellipse cx="84" cy="104" rx="17" ry="19" fill="#fff"/>
    <circle cx="38" cy="110" r="6" fill="#22242b"/>
    <circle cx="86" cy="110" r="6" fill="#22242b"/>
    <path d="M19 100 a17 19 0 0 1 34 0 Z" fill="#c7837e"/>
    <path d="M67 100 a17 19 0 0 1 34 0 Z" fill="#c7837e"/>
    <!-- mouth -->
    <ellipse cx="62" cy="136" rx="16" ry="7" fill="#8c2f3a"/>
    <!-- cap -->
    <path d="M-4 84 a64 56 0 0 1 128 0 Z" fill="#ff2d95"/>
    <ellipse cx="96" cy="84" rx="50" ry="9" fill="#b81f6b"/>
    <!-- arm with water pistol -->
    <rect x="106" y="160" width="46" height="10" rx="5" fill="#f2a09a" transform="rotate(-28 106 165)"/>
    <circle cx="150" cy="142" r="14" fill="#f0894a"/>
    <rect x="146" y="112" width="52" height="20" rx="6" fill="#f7f6f2" transform="rotate(-28 146 122)"/>
    <circle cx="170" cy="96" r="14" fill="#ff2d95" opacity="0.88"/>
  </g>
  <g font-family="ui-rounded, 'SF Pro Rounded', 'Nunito', -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    <text x="300" y="150" font-size="104" font-weight="900" letter-spacing="4" fill="url(#title)">INKWARS</text>
    <text x="300" y="200" font-size="26" font-weight="700" fill="#23314d" opacity="0.7">Paint the arena. Dive in.</text>
  </g>
</svg>
