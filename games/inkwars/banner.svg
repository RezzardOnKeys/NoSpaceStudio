<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f08a80"/>
      <stop offset="0.5" stop-color="#f0894a"/>
      <stop offset="1" stop-color="#6fbf73"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="#eceef1"/>
  <!-- the arena seen from above: floor, barrier, blocks -->
  <rect x="160" y="150" width="1600" height="780" rx="26" fill="#f08a80"/>
  <rect x="190" y="180" width="1540" height="720" rx="10" fill="#f3f1ec"/>
  <!-- bases -->
  <rect x="190" y="420" width="170" height="240" fill="#ff2d95"/>
  <rect x="1560" y="420" width="170" height="240" fill="#00cfc1"/>
  <!-- pink side -->
  <g fill="#ff2d95">
    <circle cx="470" cy="540" r="150"/>
    <circle cx="640" cy="470" r="110"/>
    <circle cx="600" cy="660" r="120"/>
    <circle cx="790" cy="570" r="90"/>
    <circle cx="430" cy="330" r="80"/>
    <circle cx="520" cy="790" r="70"/>
    <circle cx="880" cy="450" r="40"/>
    <circle cx="900" cy="690" r="30"/>
    <circle cx="720" cy="300" r="26"/>
  </g>
  <!-- teal side -->
  <g fill="#00cfc1">
    <circle cx="1450" cy="540" r="150"/>
    <circle cx="1280" cy="610" r="110"/>
    <circle cx="1320" cy="420" r="120"/>
    <circle cx="1130" cy="510" r="90"/>
    <circle cx="1490" cy="750" r="80"/>
    <circle cx="1400" cy="290" r="70"/>
    <circle cx="1040" cy="630" r="40"/>
    <circle cx="1020" cy="390" r="30"/>
    <circle cx="1200" cy="780" r="26"/>
  </g>
  <!-- blocks -->
  <g>
    <rect x="560" y="240" width="60" height="150" rx="6" fill="#f4bcb6"/>
    <rect x="1300" y="690" width="60" height="150" rx="6" fill="#f4bcb6"/>
    <rect x="470" y="720" width="180" height="150" rx="6" fill="#dde1e7"/>
    <rect x="1270" y="210" width="180" height="150" rx="6" fill="#dde1e7"/>
    <rect x="400" y="210" width="60" height="60" rx="6" fill="#bfdcc0"/>
    <rect x="1460" y="810" width="60" height="60" rx="6" fill="#bfdcc0"/>
    <rect x="810" y="420" width="300" height="240" rx="8" fill="#dde1e7"/>
    <rect x="900" y="480" width="120" height="120" rx="6" fill="#e9e4da"/>
  </g>
  <!-- title card -->
  <rect x="560" y="60" width="800" height="210" rx="48" fill="#fff"/>
  <rect x="560" y="252" width="800" height="18" rx="9" fill="#23314d" opacity="0.12"/>
  <g font-family="ui-rounded, 'SF Pro Rounded', 'Nunito', -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    <text x="960" y="180" font-size="124" font-weight="900" letter-spacing="6" fill="url(#title)">INKWARS</text>
    <text x="960" y="232" font-size="30" font-weight="700" fill="#23314d" opacity="0.7">Paint the arena. Dive in. Win the ground.</text>
  </g>
</svg>
