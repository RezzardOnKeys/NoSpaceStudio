<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Die Together</title>
    <style>
      :root {
        --ink: #1b1033;
        --paper: #fff7e3;
        --pop: #ffe03a;
        --comic-font: 'Marker Felt', 'Chalkboard SE', 'Comic Sans MS', 'Trebuchet MS', sans-serif;
        --boom-font: Impact, 'Arial Black', 'Haettenschweiler', sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden; /* the game fills the window and never scrolls */
        background: linear-gradient(#58c4ff 0%, #a8e4ff 55%, #e9fbff 100%); /* a cheerful sky */
        color: var(--ink);
        font-family: var(--comic-font);
        user-select: none;
        -webkit-user-select: none;
      }
      [hidden] {
        display: none !important;
      }
      #view {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      /* ---- Heads-up display during a round ---- */
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      #crosshair {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 10px;
        height: 10px;
        translate: -50% -50%;
        background: #fff;
        border: 3px solid var(--ink);
        border-radius: 50%;
      }
      .tagchip {
        position: absolute;
        padding: 5px 14px;
        background: var(--c, var(--paper));
        border: 3px solid var(--ink);
        border-radius: 999px;
        box-shadow: 4px 4px 0 var(--ink);
        font-size: 16px;
        font-weight: 700;
      }
      #roleTag {
        top: 16px;
        left: 16px;
      }
      #hint {
        top: 62%;
        left: 50%;
        translate: -50% 0;
        background: var(--pop);
        font-size: 20px;
      }
      /* Fills up around the crosshair while the keyboard player reloads. */
      #reloadRing {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 76px;
        height: 76px;
        translate: -50% -50%;
        rotate: -90deg;
      }
      #reloadRing circle {
        fill: none;
      }
      #reloadRing .outline {
        stroke: var(--ink);
        stroke-width: 9;
      }
      #reloadRing .track {
        stroke: rgba(255, 255, 255, 0.75);
        stroke-width: 5;
      }
      #reloadRing .fill {
        stroke: var(--pop);
        stroke-width: 5;
        stroke-dasharray: 100.5;
      }
      .meter {
        position: absolute;
        bottom: 16px;
        display: flex;
        gap: 6px;
        padding: 8px 12px;
        background: var(--paper);
        border: 3px solid var(--ink);
        border-radius: 14px;
        box-shadow: 4px 4px 0 var(--ink);
      }
      #lives {
        left: 16px;
        font-size: 26px;
        line-height: 1;
        color: #ff3b5c;
      }
      #lives .lost {
        color: #cfc8b6;
      }
      #ammo {
        right: 16px;
        align-items: flex-end;
      }
      #ammo span {
        width: 10px;
        height: 26px;
        background: #ffb52e;
        border: 3px solid var(--ink);
        border-radius: 6px 6px 2px 2px;
      }
      #ammo .used {
        background: #cfc8b6;
        opacity: 0.6;
      }
      /* Clicked with an empty magazine: it turns red and shakes. */
      #ammo.empty {
        border-color: #ff3b5c;
        animation: shake 0.45s ease-in-out;
      }
      #ammo.empty span {
        background: #ff3b5c;
        opacity: 1;
      }
      @keyframes shake {
        0%, 100% { translate: 0 0; }
        15% { translate: -9px 0; rotate: -4deg; }
        35% { translate: 8px 0; rotate: 3deg; }
        55% { translate: -6px 0; rotate: -2deg; }
        75% { translate: 4px 0; rotate: 1deg; }
      }
      #count {
        position: absolute;
        top: 22%;
        left: 50%;
        translate: -50% 0;
        font: 400 clamp(80px, 14vw, 170px) / 1 var(--boom-font);
        color: var(--pop);
        -webkit-text-stroke: 6px var(--ink);
        paint-order: stroke fill;
        text-shadow: 6px 6px 0 var(--ink);
      }
      #banner {
        position: absolute;
        top: 16%;
        left: 50%;
        translate: -50% 0;
        width: max-content;
        max-width: 92vw;
        padding: 14px 30px 16px;
        text-align: center;
        background: var(--c, var(--paper));
        border: 5px solid var(--ink);
        border-radius: 20px;
        box-shadow: 8px 8px 0 var(--ink);
      }
      #bannerTitle {
        font: 400 clamp(34px, 6vw, 64px) / 1.05 var(--boom-font);
        letter-spacing: 0.04em;
      }
      #bannerSub {
        margin-top: 4px;
        font-size: clamp(16px, 2vw, 22px);
        font-weight: 700;
      }
      /* A short red frame around the screen when your character is hit. */
      #hurt {
        position: absolute;
        inset: 0;
        box-shadow: inset 0 0 0 14px #ff3b5c, inset 0 0 90px 30px rgba(255, 59, 92, 0.55);
        opacity: 0;
      }
      #hurt.on {
        animation: hurt 0.45s ease-out;
      }
      @keyframes hurt {
        from { opacity: 1; }
        to { opacity: 0; }
      }

      /* ---- Hearts floating above the other characters ---- */
      #labels {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .hearts {
        position: absolute;
        left: 0;
        top: 0;
        font-size: 18px;
        line-height: 1;
        letter-spacing: 1px;
        color: #ff3b5c;
        white-space: nowrap;
        -webkit-text-stroke: 3px var(--ink);
        paint-order: stroke fill;
      }

      /* ---- Panels: notice, menu, round ---- */
      .overlay {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 16px;
        background: rgba(27, 16, 51, 0.35);
      }
      .panel {
        position: relative;
        width: min(820px, 100%);
        max-height: 100%;
        overflow: auto;
        padding: 22px 26px 24px;
        text-align: center;
        background-color: var(--paper);
        /* halftone dots, like printed comics */
        background-image: radial-gradient(rgba(27, 16, 51, 0.09) 1.5px, transparent 1.6px);
        background-size: 12px 12px;
        border: 5px solid var(--ink);
        border-radius: 22px;
        box-shadow: 10px 10px 0 var(--ink);
      }
      .panel.small {
        width: min(520px, 100%);
      }
      .logo {
        margin: 0;
        font: 400 clamp(40px, 7vw, 68px) / 0.95 var(--boom-font);
        letter-spacing: 0.03em;
        color: var(--pop);
        -webkit-text-stroke: 4px var(--ink);
        paint-order: stroke fill;
        text-shadow: 5px 5px 0 var(--ink);
        rotate: -3deg;
      }
      .lead {
        margin: 12px 0 14px;
        font-size: 18px;
        font-weight: 700;
      }
      h2 {
        margin: 16px 0 8px;
        font-size: 17px;
      }

      /* ---- Team cards with their two seats ---- */
      #teams {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
      }
      .team {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 10px;
        background: var(--c);
        border: 4px solid var(--ink);
        border-radius: 16px;
        box-shadow: 5px 5px 0 var(--ink);
      }
      .team h3 {
        margin: 0;
        font: 400 22px/1.1 var(--boom-font);
        letter-spacing: 0.05em;
      }
      .seat {
        display: grid;
        grid-template-columns: auto 1fr;
        align-items: center;
        gap: 0 8px;
        min-height: 58px;
        padding: 6px 10px;
        text-align: left;
        font: inherit;
        color: var(--ink);
        background: #fff;
        border: 3px solid var(--ink);
        border-radius: 12px;
        cursor: pointer;
        transition: transform 0.12s;
      }
      .seat .icon {
        grid-row: span 2;
        font-size: 24px;
      }
      .seat .role {
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        opacity: 0.7;
      }
      .seat .who {
        overflow: hidden;
        font-size: 16px;
        font-weight: 700;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .seat.free .who {
        font-weight: 400;
        opacity: 0.6;
      }
      .seat:hover:not(:disabled) {
        transform: scale(1.04);
      }
      .seat.mine {
        background: var(--pop);
        box-shadow: 0 0 0 3px var(--paper), 0 0 0 6px var(--ink);
      }
      .seat:disabled {
        cursor: not-allowed;
        background: #ece6d6;
      }

      /* ---- Who is here ---- */
      #players {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      #players li {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 4px 12px 4px 6px;
        background: #fff;
        border: 3px solid var(--ink);
        border-radius: 999px;
        font-weight: 700;
      }
      #players li.joining {
        border-style: dashed;
        font-weight: 400;
        opacity: 0.7;
      }
      #players .dot {
        width: 20px;
        height: 20px;
        border: 3px solid var(--ink);
        border-radius: 50%;
        background: var(--c, #fff);
      }

      .btn {
        margin-top: 18px;
        padding: 10px 34px;
        font: 400 26px/1.1 var(--boom-font);
        letter-spacing: 0.05em;
        color: var(--ink);
        background: var(--pop);
        border: 4px solid var(--ink);
        border-radius: 14px;
        box-shadow: 5px 5px 0 var(--ink);
        cursor: pointer;
      }
      .btn:hover:not(:disabled) {
        translate: -1px -1px;
        box-shadow: 7px 7px 0 var(--ink);
      }
      .btn:active:not(:disabled) {
        translate: 3px 3px;
        box-shadow: 2px 2px 0 var(--ink);
      }
      .btn:disabled {
        background: #d9d3c2;
        cursor: not-allowed;
      }
      button:focus-visible {
        outline: 4px solid #7a2cff;
        outline-offset: 3px;
      }
      #lobbyStatus {
        min-height: 1.3em;
        margin: 12px 0 0;
        font-weight: 700;
      }
      .controls {
        margin: 12px 0 0;
        font-size: 15px;
      }

      .setting {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin: 12px 0 0;
        font-size: 15px;
        font-weight: 700;
      }
      .setting input {
        width: 180px;
        accent-color: var(--ink);
      }

      .chip {
        position: fixed;
        padding: 5px 14px;
        background: var(--pop);
        border: 3px solid var(--ink);
        border-radius: 999px;
        box-shadow: 4px 4px 0 var(--ink);
        font-size: 16px;
        font-weight: 700;
      }
      #toast {
        top: 16px;
        right: 16px;
        max-width: 60vw;
      }

      @media (max-width: 700px) {
        #teams {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .seat {
          transition: none;
        }
        #hurt.on,
        #ammo.empty {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="labels" aria-hidden="true"></div>

    <div id="hud" hidden>
      <div id="hurt" aria-hidden="true"></div>
      <svg id="reloadRing" viewBox="0 0 44 44" aria-hidden="true" hidden>
        <circle class="outline" cx="22" cy="22" r="16" />
        <circle class="track" cx="22" cy="22" r="16" />
        <circle id="reloadFill" class="fill" cx="22" cy="22" r="16" />
      </svg>
      <div id="crosshair" aria-hidden="true"></div>
      <div id="roleTag" class="tagchip"></div>
      <div id="hint" class="tagchip" role="status" hidden></div>
      <div id="count" aria-live="assertive" hidden></div>
      <div id="banner" role="status" hidden>
        <div id="bannerTitle"></div>
        <div id="bannerSub"></div>
      </div>
      <div id="lives" class="meter" role="img" hidden></div>
      <div id="ammo" class="meter" role="img" hidden></div>
    </div>

    <div id="notice" class="overlay" hidden>
      <div class="panel small">
        <h1 class="logo">DIE TOGETHER</h1>
        <p class="lead">
          Die Together needs a party of 2, 4, 6 or 8 players. Start it from the launcher with
          your party.
        </p>
      </div>
    </div>

    <div id="lobby" class="overlay" hidden>
      <div class="panel">
        <h1 class="logo">DIE TOGETHER</h1>
        <p class="lead">Two players, one character. Pick a team and a role.</p>
        <div id="teams"></div>
        <h2>Players</h2>
        <ul id="players"></ul>
        <button id="startBtn" class="btn" type="button" aria-describedby="lobbyStatus" hidden>
          Start
        </button>
        <p id="lobbyStatus" role="status"></p>
        <p class="controls">
          <b>Mouse:</b> look, aim, shoot · <b>Keyboard:</b> WASD walk, Space jump, R reload
        </p>
        <label class="setting">
          Mouse speed
          <input id="sens" type="range" min="0.3" max="3" step="0.1" value="1" />
        </label>
      </div>
    </div>

    <div id="toast" class="chip" role="status" hidden></div>

    <script type="module" src="game.js"></script>
  </body>
</html>
