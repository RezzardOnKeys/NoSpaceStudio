<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game template</title>
    <style>
      /* The launcher shows the game in an iframe that fills the player, so
         the page must fill its window and never scroll. */
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      body {
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 30%, #1e2332, #0a0c12 75%);
        color: #eceef5;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
      }
      main {
        max-width: 28rem;
        padding: 2rem;
      }
      .dot {
        width: 3.5rem;
        height: 3.5rem;
        margin: 0 auto 1.5rem;
        border-radius: 1rem;
        background: linear-gradient(135deg, #a594ff, #6d4aff);
        animation: float 2.4s ease-in-out infinite;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
      }
      p {
        margin: 0;
        color: #a3a9bd;
        line-height: 1.6;
      }
      @keyframes float {
        50% {
          transform: translateY(-0.6rem) rotate(8deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .dot {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="dot" aria-hidden="true"></div>
      <h1>This game is not uploaded yet</h1>
      <p>
        You are looking at the starter template. Copy this folder, rename it and put your game
        here to get started.
      </p>
    </main>
  </body>
</html>
