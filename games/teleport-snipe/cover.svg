<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bcd9ea"/>
      <stop offset="0.7" stop-color="#f3e3c8"/>
      <stop offset="1" stop-color="#f6d6b0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamRed" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e0452b" stop-opacity="0.85"/>
      <stop offset="0.65" stop-color="#e0452b" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#e0452b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamBlue" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2f7fe0" stop-opacity="0.85"/>
      <stop offset="0.65" stop-color="#2f7fe0" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#2f7fe0" stop-opacity="0"/>
    </linearGradient>
    <pattern id="rake" width="600" height="14" patternUnits="userSpaceOnUse">
      <rect width="600" height="14" fill="#ece5d6"/>
      <rect y="6" width="600" height="2.5" fill="#d3c8b1"/>
    </pattern>
  </defs>

  <rect width="600" height="800" fill="url(#sky)"/>
  <circle cx="455" cy="250" r="70" fill="#fff4dc" opacity="0.8"/>

  <!-- pagoda -->
  <g transform="translate(470 470)">
    <rect x="-8" y="-262" width="16" height="70" fill="#d9a441"/>
    <polygon points="-82,-190 82,-190 50,-215 -50,-215" fill="#3f4852"/>
    <rect x="-38" y="-190" width="76" height="52" fill="#c23a2c"/>
    <polygon points="-104,-138 104,-138 64,-170 -64,-170" fill="#3f4852"/>
    <rect x="-46" y="-138" width="92" height="56" fill="#f3eee4"/>
    <rect x="-90" y="-86" width="180" height="10" fill="#8a5a36"/>
    <polygon points="-120,-82 120,-82 78,-112 -78,-112" fill="#3f4852"/>
    <rect x="-54" y="-82" width="108" height="82" fill="#c23a2c"/>
    <rect x="-14" y="-60" width="28" height="60" fill="#3d2a1f"/>
  </g>

  <!-- temple wall with its tiled roof -->
  <rect x="0" y="392" width="600" height="18" fill="#3f4852"/>
  <rect x="0" y="410" width="600" height="72" fill="#f3eee4"/>
  <rect x="0" y="470" width="600" height="20" fill="#9a958d"/>

  <!-- raked gravel -->
  <rect x="0" y="490" width="600" height="310" fill="url(#rake)"/>
  <ellipse cx="120" cy="640" rx="62" ry="26" fill="#8e8a83"/>
  <ellipse cx="112" cy="630" rx="44" ry="18" fill="#a7a39b"/>
  <ellipse cx="520" cy="700" rx="48" ry="20" fill="#8e8a83"/>
  <ellipse cx="514" cy="692" rx="32" ry="13" fill="#a7a39b"/>

  <!-- stone lantern -->
  <g transform="translate(70 560)">
    <rect x="-22" y="-8" width="44" height="12" fill="#8e8a83"/>
    <rect x="-8" y="-60" width="16" height="52" fill="#b7b2a8"/>
    <rect x="-24" y="-96" width="48" height="36" fill="#fff1c9"/>
    <rect x="-24" y="-96" width="48" height="36" fill="none" stroke="#8e8a83" stroke-width="6"/>
    <polygon points="-40,-96 40,-96 0,-128" fill="#8e8a83"/>
  </g>

  <!-- the two teleport flashes: where the player was (red) and where they landed (blue) -->
  <rect x="190" y="330" width="64" height="300" fill="url(#beamRed)"/>
  <rect x="210" y="330" width="24" height="300" fill="url(#beam)"/>
  <rect x="356" y="350" width="64" height="330" fill="url(#beamBlue)"/>
  <rect x="376" y="350" width="24" height="330" fill="url(#beam)"/>
  <ellipse cx="222" cy="630" rx="44" ry="10" fill="#e0452b" opacity="0.35"/>
  <ellipse cx="388" cy="680" rx="44" ry="10" fill="#2f7fe0" opacity="0.35"/>

  <!-- the sniper in a blue coat, just landed -->
  <g transform="translate(388 680)">
    <polygon points="-26,0 26,0 17,-86 -17,-86" fill="#2f7fe0" stroke="#1d1a17" stroke-width="4"/>
    <circle cx="0" cy="-100" r="14" fill="#f1c9a5" stroke="#1d1a17" stroke-width="4"/>
    <polygon points="-32,-108 32,-108 0,-128" fill="#d9b56a" stroke="#1d1a17" stroke-width="4"/>
    <rect x="-46" y="-72" width="70" height="7" fill="#2c3034" stroke="#1d1a17" stroke-width="2"/>
  </g>

  <!-- scope ring -->
  <circle cx="388" cy="600" r="96" fill="none" stroke="#1d1a17" stroke-width="5" opacity="0.75"/>
  <line x1="292" y1="600" x2="484" y2="600" stroke="#1d1a17" stroke-width="2" opacity="0.6"/>
  <line x1="388" y1="504" x2="388" y2="696" stroke="#1d1a17" stroke-width="2" opacity="0.6"/>

  <!-- petals -->
  <g fill="#f4b3c8">
    <ellipse cx="240" cy="420" rx="7" ry="4" transform="rotate(30 240 420)"/>
    <ellipse cx="200" cy="480" rx="6" ry="4" transform="rotate(-20 200 480)"/>
    <ellipse cx="420" cy="440" rx="7" ry="4" transform="rotate(50 420 440)"/>
    <ellipse cx="350" cy="520" rx="6" ry="3.5" transform="rotate(10 350 520)"/>
    <ellipse cx="300" cy="360" rx="6" ry="4" transform="rotate(-40 300 360)"/>
    <ellipse cx="150" cy="300" rx="7" ry="4" transform="rotate(20 150 300)"/>
    <ellipse cx="520" cy="560" rx="6" ry="4" transform="rotate(-10 520 560)"/>
  </g>

  <!-- cherry branch across the top left -->
  <path d="M -10 230 C 80 210, 150 190, 260 150 C 300 136, 330 120, 360 96" stroke="#5b3a2a" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M 150 190 C 170 230, 190 250, 230 262" stroke="#5b3a2a" stroke-width="8" fill="none" stroke-linecap="round"/>
  <g>
    <circle cx="40" cy="214" r="34" fill="#f4b3c8"/>
    <circle cx="96" cy="196" r="38" fill="#f9d2de"/>
    <circle cx="160" cy="176" r="34" fill="#f4b3c8"/>
    <circle cx="222" cy="256" r="28" fill="#f9d2de"/>
    <circle cx="250" cy="150" r="30" fill="#f08fb0"/>
    <circle cx="320" cy="112" r="26" fill="#f9d2de"/>
    <circle cx="190" cy="226" r="24" fill="#f08fb0"/>
  </g>

  <!-- title on a wooden plaque -->
  <g transform="translate(300 178)">
    <rect x="-250" y="-40" width="500" height="88" rx="6" fill="#cf9a62" stroke="#241912" stroke-width="5"/>
    <text x="-18" y="22" text-anchor="middle" font-family="'Hiragino Mincho ProN', 'Yu Mincho', Georgia, serif" font-size="54" font-weight="700" fill="#241912">Teleport Snipe</text>
    <rect x="196" y="-22" width="40" height="40" rx="4" fill="#c23a2c" transform="rotate(-6 216 -2)"/>
  </g>
</svg>
