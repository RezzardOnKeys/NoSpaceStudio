<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bcd9ea"/>
      <stop offset="0.65" stop-color="#f3e3c8"/>
      <stop offset="1" stop-color="#f6d6b0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamRed" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e0452b" stop-opacity="0.85"/>
      <stop offset="0.65" stop-color="#e0452b" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#e0452b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamBlue" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2f7fe0" stop-opacity="0.85"/>
      <stop offset="0.65" stop-color="#2f7fe0" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#2f7fe0" stop-opacity="0"/>
    </linearGradient>
    <pattern id="rake" width="1920" height="18" patternUnits="userSpaceOnUse">
      <rect width="1920" height="18" fill="#ece5d6"/>
      <rect y="8" width="1920" height="3" fill="#d3c8b1"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <circle cx="1500" cy="300" r="110" fill="#fff4dc" opacity="0.8"/>

  <!-- pagoda -->
  <g transform="translate(1560 640) scale(1.6)">
    <rect x="-8" y="-262" width="16" height="70" fill="#d9a441"/>
    <polygon points="-82,-190 82,-190 50,-215 -50,-215" fill="#3f4852"/>
    <rect x="-38" y="-190" width="76" height="52" fill="#c23a2c"/>
    <polygon points="-104,-138 104,-138 64,-170 -64,-170" fill="#3f4852"/>
    <rect x="-46" y="-138" width="92" height="56" fill="#f3eee4"/>
    <rect x="-90" y="-86" width="180" height="10" fill="#8a5a36"/>
    <polygon points="-120,-82 120,-82 78,-112 -78,-112" fill="#3f4852"/>
    <rect x="-54" y="-82" width="108" height="82" fill="#c23a2c"/>
    <rect x="-14" y="-60" width="28" height="60" fill="#3d2a1f"/>
  </g>

  <!-- torii -->
  <g transform="translate(1110 660)">
    <rect x="-130" y="-250" width="22" height="250" fill="#c23a2c"/>
    <rect x="108" y="-250" width="22" height="250" fill="#c23a2c"/>
    <rect x="-150" y="-200" width="300" height="16" fill="#c23a2c"/>
    <path d="M -190 -262 Q 0 -250 190 -262 L 180 -238 Q 0 -230 -180 -238 Z" fill="#3d2a1f"/>
  </g>

  <!-- temple wall -->
  <rect x="0" y="560" width="1920" height="24" fill="#3f4852"/>
  <rect x="0" y="584" width="1920" height="90" fill="#f3eee4"/>
  <rect x="0" y="660" width="1920" height="24" fill="#9a958d"/>

  <!-- raked gravel with rocks -->
  <rect x="0" y="684" width="1920" height="396" fill="url(#rake)"/>
  <ellipse cx="1300" cy="880" rx="110" ry="40" fill="#8e8a83"/>
  <ellipse cx="1288" cy="866" rx="78" ry="26" fill="#a7a39b"/>
  <ellipse cx="1780" cy="960" rx="90" ry="34" fill="#8e8a83"/>
  <ellipse cx="1770" cy="948" rx="62" ry="22" fill="#a7a39b"/>

  <!-- the two flashes of a teleport -->
  <rect x="1000" y="520" width="80" height="380" fill="url(#beamRed)"/>
  <rect x="1026" y="520" width="28" height="380" fill="url(#beam)"/>
  <ellipse cx="1040" cy="900" rx="56" ry="12" fill="#e0452b" opacity="0.35"/>
  <rect x="1420" y="560" width="80" height="420" fill="url(#beamBlue)"/>
  <rect x="1446" y="560" width="28" height="420" fill="url(#beam)"/>
  <ellipse cx="1460" cy="980" rx="56" ry="12" fill="#2f7fe0" opacity="0.35"/>

  <!-- the sniper, just landed, and the scope on them -->
  <g transform="translate(1460 980) scale(1.3)">
    <polygon points="-26,0 26,0 17,-86 -17,-86" fill="#2f7fe0" stroke="#1d1a17" stroke-width="4"/>
    <circle cx="0" cy="-100" r="14" fill="#f1c9a5" stroke="#1d1a17" stroke-width="4"/>
    <polygon points="-32,-108 32,-108 0,-128" fill="#d9b56a" stroke="#1d1a17" stroke-width="4"/>
    <rect x="-46" y="-72" width="70" height="7" fill="#2c3034" stroke="#1d1a17" stroke-width="2"/>
  </g>
  <circle cx="1460" cy="880" r="140" fill="none" stroke="#1d1a17" stroke-width="6" opacity="0.75"/>
  <line x1="1320" y1="880" x2="1600" y2="880" stroke="#1d1a17" stroke-width="2.5" opacity="0.6"/>
  <line x1="1460" y1="740" x2="1460" y2="1020" stroke="#1d1a17" stroke-width="2.5" opacity="0.6"/>

  <!-- petals -->
  <g fill="#f4b3c8">
    <ellipse cx="1060" cy="600" rx="9" ry="5" transform="rotate(30 1060 600)"/>
    <ellipse cx="1180" cy="760" rx="8" ry="5" transform="rotate(-20 1180 760)"/>
    <ellipse cx="1380" cy="640" rx="9" ry="5" transform="rotate(50 1380 640)"/>
    <ellipse cx="1620" cy="760" rx="8" ry="5" transform="rotate(10 1620 760)"/>
    <ellipse cx="960" cy="440" rx="8" ry="5" transform="rotate(-40 960 440)"/>
    <ellipse cx="1840" cy="560" rx="9" ry="5" transform="rotate(20 1840 560)"/>
  </g>

  <!-- cherry branch from the top right -->
  <path d="M 1940 120 C 1820 140, 1700 170, 1600 230 C 1540 266, 1480 290, 1400 300" stroke="#5b3a2a" stroke-width="16" fill="none" stroke-linecap="round"/>
  <g>
    <circle cx="1880" cy="130" r="46" fill="#f4b3c8"/>
    <circle cx="1790" cy="160" r="50" fill="#f9d2de"/>
    <circle cx="1700" cy="190" r="42" fill="#f08fb0"/>
    <circle cx="1610" cy="236" r="44" fill="#f4b3c8"/>
    <circle cx="1520" cy="272" r="36" fill="#f9d2de"/>
    <circle cx="1420" cy="300" r="30" fill="#f08fb0"/>
  </g>

  <!-- title on the left, on a wooden plaque -->
  <g transform="translate(110 250)">
    <rect x="0" y="0" width="780" height="300" rx="10" fill="#cf9a62" stroke="#241912" stroke-width="6"/>
    <text x="50" y="150" font-family="'Hiragino Mincho ProN', 'Yu Mincho', Georgia, serif" font-size="104" font-weight="700" fill="#241912">Teleport Snipe</text>
    <text x="54" y="226" font-family="'Hiragino Sans', 'Avenir Next', 'Segoe UI', sans-serif" font-size="38" font-weight="700" fill="#241912" opacity="0.8">One shot. Miss, and you teleport.</text>
    <rect x="700" y="26" width="54" height="54" rx="5" fill="#c23a2c" transform="rotate(-6 727 53)"/>
  </g>
</svg>
